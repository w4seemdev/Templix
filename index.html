<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080A" />
    <title>Templix — Website Templates for Developers</title>
    <meta name="description" content="Browse professionally designed, fully responsive website templates built with React, TypeScript, and Vite. Buy once, use forever." />
    <meta name="keywords" content="website templates, react templates, typescript templates, vite templates, buy templates, web design" />
    <meta name="author" content="Templix" />

    <!-- Pre-hydration defaults for "/" only. useSEO rewrites canonical, og:url and the
         title/description pairs on every route change (see src/hooks/useSEO.ts). -->
    <link rel="canonical" href="https://templix-peach.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:site_name"     content="Templix" />
    <meta property="og:title"         content="Templix — Website Templates for Developers" />
    <meta property="og:description"   content="Browse professionally designed, fully responsive React + TypeScript website templates. Buy once, use forever." />
    <meta property="og:type"          content="website" />
    <meta property="og:url"           content="https://templix-peach.vercel.app/" />
    <meta property="og:image"         content="https://templix-peach.vercel.app/og-image.png" />
    <meta property="og:image:type"    content="image/png" />
    <meta property="og:image:width"   content="1200" />
    <meta property="og:image:height"  content="630" />
    <meta property="og:image:alt"     content="Templix — website template marketplace" />

    <!-- Twitter -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Templix — Website Templates" />
    <meta name="twitter:description" content="Browse professionally designed, fully responsive React + TypeScript website templates. Buy once, use forever." />
    <meta name="twitter:image"       content="https://templix-peach.vercel.app/og-image.png" />
    <meta name="twitter:image:alt"   content="Templix — website template marketplace" />

    <!-- Fonts: Inter (UI/display, max weight 600) + JetBrains Mono (prices, stats, keys) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Prevent white flash before CSS loads -->
    <style>html { background-color: #07080a; color-scheme: dark; }</style>

    <!-- Brand entity for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://templix-peach.vercel.app/#website",
            "name": "Templix",
            "url": "https://templix-peach.vercel.app/",
            "publisher": { "@id": "https://templix-peach.vercel.app/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://templix-peach.vercel.app/#organization",
            "name": "Templix",
            "url": "https://templix-peach.vercel.app/",
            "logo": "https://templix-peach.vercel.app/og-image.png"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
